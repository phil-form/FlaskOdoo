# Exclusions de règles CRS — les « faux positifs » de CETTE application.
#
# Un WAF générique ne connaît pas votre application: il voit passer des chaînes
# qui ressemblent à des attaques. Le travail consiste à distinguer:
#
#   - le vrai positif      -> on laisse bloquer;
#   - le faux positif      -> on exclut la règle, le plus finement possible.
#
# Le réflexe à ne PAS avoir: baisser la paranoïa, ou passer en DetectionOnly
# « le temps de voir ». Ça désarme le WAF partout, pour un problème local.
#
# Comment trouver la règle à exclure: reproduire la requête, lire le journal
# d'audit (docker compose logs waf) et relever l'`id` de la règle déclenchée.
#
#   docker compose logs -f waf | grep -i "Matched"
#
# Trois niveaux de finesse, du meilleur au pire:
#   1. exclure la règle pour UN paramètre d'UNE URL   <- viser ça
#   2. exclure la règle pour UNE URL
#   3. désactiver la règle partout                    <- en dernier recours

# --- Exemple 1: le champ « description » d'un article ------------------------
# Un article peut légitimement contenir « SELECT », « <script> » ou « -- » dans
# sa description (on vend du matériel informatique, on parle de code).
# On exclut donc les règles d'injection SQL et de XSS UNIQUEMENT sur ce
# paramètre, sur les deux URL qui l'acceptent.
SecRule REQUEST_URI "@rx ^/items/(add|[0-9]+/edit)$" \
    "id:1000,\
     phase:1,\
     pass,\
     nolog,\
     ctl:ruleRemoveTargetByTag=attack-sqli;ARGS:description,\
     ctl:ruleRemoveTargetByTag=attack-xss;ARGS:description"

# --- Exemple 2: le jeton CSRF -----------------------------------------------
# Les jetons base64 déclenchent parfois les règles de détection d'encodage.
# Le jeton est vérifié par l'application (CSRFProtect), le WAF n'a rien à y voir.
SecRule REQUEST_URI "@rx ^/" \
    "id:1001,\
     phase:1,\
     pass,\
     nolog,\
     ctl:ruleRemoveTargetByTag=attack-protocol;ARGS:csrf_token"

# --- Ce qu'on ne fait PAS ---------------------------------------------------
# SecRuleRemoveById 942100      <- désactiver toute la détection SQLi: non.
# SecRuleEngine DetectionOnly   <- désarmer le WAF: non.
